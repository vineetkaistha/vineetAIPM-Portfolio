<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f7fb">
    <title>Rock, Paper, Scissors</title>
    <script>
        (() => {
            let theme = 'light';
            try {
                if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    theme = 'dark';
                }
            } catch (error) {
                // Light mode is the fallback when the system preference is unavailable.
            }
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <style>
        :root {
            color-scheme: light;
            --page: #f4f7fb;
            --surface: #ffffff;
            --text: #202b3c;
            --muted: #64748b;
            --border: #dce4ef;
            --accent: #4859ca;
            --accent-hover: #3747b5;
            --focus: #e48928;
            --result: #edf1ff;
            --shadow: 0 16px 40px rgba(37, 55, 92, 0.1);
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --page: #121722;
            --surface: #1d2533;
            --text: #edf1f8;
            --muted: #b0bacb;
            --border: #364153;
            --accent: #7888ff;
            --accent-hover: #91a0ff;
            --focus: #ffd17a;
            --result: #29314c;
            --shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 28px 16px;
            place-items: center;
            color: var(--text);
            background:
                radial-gradient(ellipse at 50% 0, rgba(102, 122, 224, 0.12), transparent 58%),
                var(--page);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button {
            min-height: 46px;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            background: var(--surface);
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            touch-action: manipulation;
        }

        button:focus-visible {
            outline: 3px solid var(--focus);
            outline-offset: 3px;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .app {
            width: min(100%, 560px);
        }

        header {
            margin-bottom: 22px;
            text-align: center;
        }

        .eyebrow {
            margin: 0 0 4px;
            color: var(--accent);
            font-size: 0.76rem;
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 8vw, 3rem);
            letter-spacing: -0.055em;
            line-height: 1.1;
        }

        .subtitle {
            margin: 8px 0 0;
            color: var(--muted);
        }

        .game-card {
            padding: clamp(18px, 5vw, 30px);
            border: 1px solid var(--border);
            border-radius: 22px;
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .scoreboard {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
        }

        .score {
            padding: 13px 10px;
            border: 1px solid var(--border);
            border-radius: 14px;
            text-align: center;
        }

        .score-label {
            display: block;
            color: var(--muted);
            font-size: 0.76rem;
            font-weight: 750;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .score-value {
            display: block;
            margin-top: 2px;
            font-size: 2rem;
            font-variant-numeric: tabular-nums;
            font-weight: 850;
            line-height: 1.1;
        }

        .versus {
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 850;
            letter-spacing: 0.1em;
        }

        .result {
            display: grid;
            min-height: 126px;
            margin-bottom: 22px;
            padding: 16px;
            place-items: center;
            border-radius: 16px;
            background: var(--result);
            text-align: center;
        }

        .result-title {
            margin: 0;
            font-size: 1.2rem;
        }

        .round-details {
            margin: 7px 0 0;
            color: var(--muted);
        }

        .choices-label {
            margin: 0 0 10px;
            font-size: 0.86rem;
            font-weight: 750;
            text-align: center;
        }

        .choices {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
        }

        .choice {
            display: grid;
            min-height: 100px;
            align-content: center;
            justify-items: center;
            gap: 5px;
            padding: 12px 8px;
            transition: transform 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
        }

        .choice:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: var(--accent);
            box-shadow: 0 5px 16px rgba(72, 89, 202, 0.14);
        }

        .choice-symbol {
            font-size: 1.8rem;
            line-height: 1;
        }

        .choice-name {
            font-size: 0.9rem;
        }

        .actions {
            display: flex;
            justify-content: center;
            margin-top: 18px;
        }

        .reset {
            padding: 0.65rem 1.1rem;
        }

        .hint {
            margin: 17px 0 0;
            color: var(--muted);
            font-size: 0.82rem;
            text-align: center;
        }

        @media (max-width: 380px) {
            body {
                padding: 18px 10px;
            }

            .choices {
                gap: 7px;
            }

            .choice {
                min-height: 88px;
                padding: 9px 5px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="app">
        <header>
            <p class="eyebrow">Quick match</p>
            <h1>Rock, Paper, Scissors</h1>
            <p class="subtitle">First to 3 wins takes the match.</p>
        </header>

        <section class="game-card" aria-label="Rock, Paper, Scissors game">
            <div class="scoreboard" aria-label="Match score">
                <div class="score">
                    <span class="score-label">You</span>
                    <span class="score-value" id="player-score">0</span>
                </div>
                <span class="versus" aria-hidden="true">VS</span>
                <div class="score">
                    <span class="score-label">Computer</span>
                    <span class="score-value" id="computer-score">0</span>
                </div>
            </div>

            <div class="result" aria-live="polite" aria-atomic="true">
                <div>
                    <h2 class="result-title" id="result-title">Make your move!</h2>
                    <p class="round-details" id="round-details">Choose rock, paper, or scissors to begin.</p>
                </div>
            </div>

            <p class="choices-label">Choose your move</p>
            <div class="choices" aria-label="Choose your move">
                <button class="choice" type="button" data-choice="rock" aria-label="Choose Rock">
                    <span class="choice-symbol" aria-hidden="true">✊</span>
                    <span class="choice-name">Rock</span>
                </button>
                <button class="choice" type="button" data-choice="paper" aria-label="Choose Paper">
                    <span class="choice-symbol" aria-hidden="true">✋</span>
                    <span class="choice-name">Paper</span>
                </button>
                <button class="choice" type="button" data-choice="scissors" aria-label="Choose Scissors">
                    <span class="choice-symbol" aria-hidden="true">✌️</span>
                    <span class="choice-name">Scissors</span>
                </button>
            </div>

            <div class="actions">
                <button class="reset" id="new-match" type="button">New match</button>
            </div>
            <p class="hint">A tie does not add a point. First to 3 round wins.</p>
        </section>
    </main>

    <script>
        (() => {
            'use strict';

            const TARGET_SCORE = 3;
            const choices = ['rock', 'paper', 'scissors'];
            const labels = {
                rock: 'Rock ✊',
                paper: 'Paper ✋',
                scissors: 'Scissors ✌️'
            };
            const beats = {
                rock: 'scissors',
                paper: 'rock',
                scissors: 'paper'
            };
            const elements = {
                playerScore: document.querySelector('#player-score'),
                computerScore: document.querySelector('#computer-score'),
                resultTitle: document.querySelector('#result-title'),
                roundDetails: document.querySelector('#round-details'),
                choiceButtons: document.querySelectorAll('[data-choice]'),
                newMatch: document.querySelector('#new-match')
            };

            let playerScore = 0;
            let computerScore = 0;
            let matchFinished = false;

            function playRound(playerChoice) {
                if (matchFinished) {
                    return;
                }

                const computerChoice = choices[Math.floor(Math.random() * choices.length)];
                let result;

                if (playerChoice === computerChoice) {
                    result = 'Tie game';
                } else if (beats[playerChoice] === computerChoice) {
                    playerScore += 1;
                    result = 'You win this round!';
                } else {
                    computerScore += 1;
                    result = 'Computer wins this round.';
                }

                elements.playerScore.textContent = String(playerScore);
                elements.computerScore.textContent = String(computerScore);
                elements.resultTitle.textContent = result;
                elements.roundDetails.textContent =
                    `You chose ${labels[playerChoice]}. Computer chose ${labels[computerChoice]}.`;

                if (playerScore === TARGET_SCORE || computerScore === TARGET_SCORE) {
                    matchFinished = true;
                    const matchResult = playerScore === TARGET_SCORE
                        ? 'You won the match! Start a new match to play again.'
                        : 'Computer won the match. Start a new match to try again.';
                    elements.resultTitle.textContent = playerScore === TARGET_SCORE
                        ? 'You won the match!'
                        : 'Computer won the match.';
                    elements.roundDetails.textContent += ` ${matchResult}`;
                    elements.choiceButtons.forEach(button => {
                        button.disabled = true;
                    });
                }
            }

            function newMatch() {
                playerScore = 0;
                computerScore = 0;
                matchFinished = false;
                elements.playerScore.textContent = '0';
                elements.computerScore.textContent = '0';
                elements.resultTitle.textContent = 'Make your move!';
                elements.roundDetails.textContent = 'Choose rock, paper, or scissors to begin.';
                elements.choiceButtons.forEach(button => {
                    button.disabled = false;
                });
            }

            elements.choiceButtons.forEach(button => {
                button.addEventListener('click', () => playRound(button.dataset.choice));
            });
            elements.newMatch.addEventListener('click', newMatch);
        })();
    </script>
</body>
</html>
